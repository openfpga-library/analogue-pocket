  updaters:
  info: "Macintosh LC for Analogue Pocket\r\n\r\nA port of the MacLC MiSTer core.
    Emulates a Motorola 68020 with Apple's V8\r\nASIC, the Egret system controller
    (a real 68HC05 running Apple firmware),\r\nSWIM floppy, NCR5380 SCSI and ADB input.\r\n\r\nAnalogue
    OS firmware 2.1 required.\r\n\r\nDifferences from the MiSTer core, made to fit
    the Pocket's smaller FPGA:\r\n* Video is 512x384 at up to 256 colours (the 12\"
    RGB monitor). No 640x480,\r\n  no 16bpp -- a 16bpp framebuffer alone needed more
    block RAM than the\r\n  Pocket has in total.\r\n* One floppy drive instead of
    two.\r\n* No CD-ROM and no BlueSCSI Toolbox.\r\n\r\nWORK IN PROGRESS. SCSI hard
    disks are not implemented yet, so the machine\r\ncan only boot from a floppy image.\r\n\r\nCredits\r\n*
    Based on the MacLC MiSTer core, which derives from MacPlus by Sorgelig\r\n  and
    originally from the Plus Too project.\r\n"
