  updaters:
  info: |
    MIRLO 64 Enhanced: A Nintendo 64 core for the Analogue Pocket, with the RSP and the RDP at 93.75 MHz.

    Put the ROMs (.z64, big-endian) in Assets/n64/common/ and launch the core. Saves (EEPROM, SRAM, FlashRAM) and the Controller Pak are kept in Saves/n64/.

    The core also appears under GB and GBC so that the Transfer Pak works.

    Controls are fully configurable. Consider that some games require remapping the controls, such as the C-Up button, or the D-Pad instead of the joystick.

    For more information visit:
    https://github.com/tortugaveloz/MIRLO64
  requires_license: false
