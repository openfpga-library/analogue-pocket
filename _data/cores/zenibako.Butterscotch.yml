  info: |
    Butterscotch Pocket (unofficial)

    Undertale v1.08; Deltarune Chapter 1
    Deltarune and save states experimental.
    Provide your own supported game data.

    Prepare data with Pocket Sync or CLI.
    github.com/zenibako/butterscotch-pocket

    Assets/butterscotch/common:
    UT: data.win, textures.bin, music.bin
    DR: deltarune.win, dr_textures.bin,
        dr_music.bin

    D-pad: Move; A/Start: Confirm
    B: Cancel; X/Y: Game menu
    Select: Butterscotch menu
    L: Toggle speed/accuracy

    Save states / sleep depend on scene.
    Select > Debug > Save-state status
    checks eligibility before sleeping.

    Select > Debug > Save log to SD card
    Quit via Analogue menu to keep logs.

    No cartridge or link-cable support.
    Dock: digital output only.

    Butterscotch runner: MrPowerGamerBR
    Pocket port: zenibako; on openfpgaOS
    No endorsement by game developers.
  requires_license: false
