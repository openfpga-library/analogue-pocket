  updaters:
  info: "Mirax Pocket Core\n=================\n\nThis core is a completely experimental
    project employing a hybrid method for \nFPGA implementation. Given the game's
    rarity, obtaining an original PCB is \nvirtually impossible, so alternative sources
    must be sought to infer its \noperation. \nWe are starting with the MAME driver's
    C++ code and existing HDL implementations \nof both the Z80 processor and the
    two GI AY-3-8912 sound chips. High-resolution \nimages of both sides of the PCB
    are available to help trace the circuit paths \nbetween the ICs and infer the
    system's functionality. This process will be \niterative and AI-assisted."
