  info: "Neo Geo Pocket / Neo Geo Pocket Color\r\n\r\nAI-created port of the MiSTer
    core by Kitrinx (Jamie Blanks) --\r\ncode by Claude (Anthropic), directed and
    tested by janisc.\r\n\r\nPlace the BIOS images in Assets/ngpc/janisc.NGPC/:\r\n
    \ boot0.rom   Color BIOS (64 KiB)\r\n  boot1.rom   Mono BIOS (64 KiB)\r\n\r\nFlash
    saves are automatic. Savestates and sleep carry the\r\ncartridge: loading a state
    also rewinds your in-game saves to\r\nthat moment. Reset to BIOS visits the BIOS
    menu (clock,\r\nhoroscope); plain Reset also unloads the cartridge and lands\r\nthere.
    A menu Reset keeps your save; to restart a game,\r\nrelaunch it.\r\n\r\nIf a game
    starts without its save, quit and launch it again:\r\nthe save file is kept. See
    docs/KNOWN_BEHAVIORS.md.\r\n"
  requires_license: false
