name: Update openFPGA Library

on:
  schedule:
    # Run every 30 minutes
    - cron: '23,53 * * * *'
  workflow_dispatch:

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Dependencies
        run: bundle install

      - name: Generate Token
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.PR_CREATOR_APP_ID }}
          private_key: ${{ secrets.PR_CREATOR_PRIVATE_KEY }}

      - name: Setup .netrc
        uses: extractions/netrc@v2
        with:
          machine: api.github.com
          username: openfpga-library-updater[bot]
          password: ${{ steps.generate-token.outputs.token }}

      - name: Updater - Update Cores
        run: |
          echo "⚙️ Updating openFPGA Library..."
          ruby .github/workflows/updater/lib/updater.rb update-inventory
          echo "🎉 Successfully updated openFPGA Library"

      - name: Updater - Generate Posts
        run: |
          echo "⚙️ Generating Jekyll Blog Posts..."
          ruby .github/workflows/updater/lib/updater.rb generate-posts
          echo "🎉 Successfully generated Blog Posts!"

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: create-pull-request/patch-${{github.run_id}}
          title: Automated update for openFPGA Library
          body: |
            > [!NOTE]
            > Triggered by [${{github.workflow}}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: |
            _data/cores/*.yml
            _data/platforms/*.yml
            _posts/*.md
            assets/images/**/*.png

      - name: Enable Auto-Merge
        if: steps.create-pull-request.outputs.pull-request-number
        run: |
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
